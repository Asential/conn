<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Consolidator</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LLM Consolidator</h1>
      <p class="subtitle">Run prompts across multiple models</p>
    </header>

    <div class="content">
      <div class="panel">
        <div class="panel-header">Input</div>
        <div class="panel-body">
          <textarea id="prompt-input" placeholder="Enter your prompt..."></textarea>
        </div>
        <div class="controls">
          <button class="btn-primary" id="send-btn">Send</button>
          <button class="btn-secondary" id="clear-btn">Clear</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">Responses</div>
        <div class="panel-body" id="responses">
          <p style="color: #666; font-size: 13px;">Responses will appear here</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/renderer.js"></script>
</body>
</html>
